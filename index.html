<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Color Storm</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body onload="main()">
    <canvas id="webgl" width="1920" height="1080" autofocus>
    Please use a browser that supports "canvas"
    </canvas>
    <button id="settingsButton"><span style = "transform: translateY(-2.8%);">⚙</span></button>
    <div id="settings" style="display: none;">
      <div>
        <h4 id="num_drops_label">Rain Drops: </h4>
        <input type="text" id="num_drops_textbox">
      </div>
      <input type="range" id="num_drops_slider" min="0" max="1000">
      
      <div>
        <h4 id="rain_speed_label">Rain Speed: </h4>
        <input type="text" id="rain_speed_textbox">
      </div>
      <input type="range" id="rain_speed_slider" min="1" max="3">
      
      <div>
        <h4 id="ripple_detail_label">Ripple Detail: </h4>
        <input type="text" id="ripple_detail_textbox">
      </div>
      <input type="range" id="ripple_detail_slider" min="3" max="20">
    </div>

    <audio autoplay loop>
      <source src="./public/rain.wav" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <script src="./lib/webgl-utils.js"></script>
    <script src="./lib/webgl-debug.js"></script>
    <script src="./lib/cuon-utils.js"></script>
    <script src="./lib/cuon-matrix.js"></script>
    <script src="script.js"></script>
  </body>
</html>
